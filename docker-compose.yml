name: desi-aahhar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desiaahhar}
      POSTGRES_USER: ${POSTGRES_USER:-desiaahhar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desiaahhar-local-password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-desiaahhar} -d ${POSTGRES_DB:-desiaahhar}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  backend:
    image: vidya687/desi-aahhar-api:local
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-desiaahhar}
      DATABASE_USERNAME: ${POSTGRES_USER:-desiaahhar}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-desiaahhar-local-password}
      JWT_SECRET: ${JWT_SECRET:-desi-aahhar-local-development-secret-change-before-production-2026}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:19006}
      ADMIN_NAME: ${ADMIN_NAME:-Desi Aahhar Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@desiaahhar.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      STAFF_NAME: ${STAFF_NAME:-Ravi Delivery}
      STAFF_EMAIL: ${STAFF_EMAIL:-delivery@desiaahhar.in}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-Delivery@123}
      DEV_OTP_CODE: ${DEV_OTP_CODE:-123456}
      EXPOSE_DEV_OTP: ${EXPOSE_DEV_OTP:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@desiaahhar.in}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      FIREBASE_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - delivery-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  admin:
    image: vidya687/desi-aahhar-admin:local
    build:
      context: ./admin-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  delivery-uploads:
